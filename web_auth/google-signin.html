<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nexo · Acceso con Google</title>
  <style>
    :root {
      --bg: #f8f4ee;
      --card: #fffdfa;
      --ink: #2e3a34;
      --muted: #66736b;
      --sage: #6f9480;
      --sage-dark: #52705f;
      --border: #e8e0d3;
      --peach: #f3c9b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 10% 10%, #e7f0ea 0, transparent 34%),
        radial-gradient(circle at 90% 90%, #fbede7 0, transparent 32%),
        var(--bg);
      color: var(--ink);
      font-family: "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
      padding: 24px;
    }
    .card {
      width: min(440px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 36px 32px 32px;
      box-shadow: 0 18px 50px rgba(46, 58, 52, .10);
      text-align: center;
    }
    .logo {
      width: 74px; height: 74px;
      margin: 0 auto 18px;
      border-radius: 22px;
      display: grid; place-items: center;
      background: linear-gradient(135deg, #a9c4b2, var(--peach));
      box-shadow: 0 10px 24px rgba(111, 148, 128, .22);
      font-size: 34px;
    }
    h1 { font-size: 26px; margin: 0 0 8px; letter-spacing: -.3px; }
    p { color: var(--muted); line-height: 1.5; margin: 0 0 22px; font-size: 15px; }
    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 15px 18px;
      background: linear-gradient(135deg, var(--sage), var(--sage-dark));
      color: #fff;
      font: inherit;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(82, 112, 95, .25);
    }
    button:disabled { opacity: .65; cursor: wait; }
    .g {
      width: 26px; height: 26px; border-radius: 50%;
      background: #fff; color: #4285f4;
      display: grid; place-items: center;
      font-weight: 900; font-size: 18px;
    }
    .status { min-height: 22px; margin-top: 16px; font-size: 14px; color: var(--muted); }
    .status.error { color: #b4534a; }
    .small { margin-top: 22px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🏠</div>
    <h1>Acceso con Google</h1>
    <p>Usa la misma cuenta de Google que en el móvil para entrar en tu familia de Nexo.</p>
    <button id="google">
      <span class="g">G</span>
      Continuar con Google
    </button>
    <div id="status" class="status"></div>
    <div class="small">Al terminar, esta pestaña se cerrará y volverás a Nexo.</div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
    import {
      getAuth,
      GoogleAuthProvider,
      getRedirectResult,
      signInWithRedirect,
      signOut,
    } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCoKV7JsivcEAwFVaPVxQgAqUM4sHrTVe0",
      authDomain: "app-home-familia.firebaseapp.com",
      projectId: "app-home-familia",
      storageBucket: "app-home-familia.firebasestorage.app",
      messagingSenderId: "1031214812224",
      appId: "1:1031214812224:web:3072ff3de562d0629423a5",
    };

    const params = new URLSearchParams(window.location.search);
    const button = document.getElementById("google");
    const status = document.getElementById("status");

    // La página puede recargarse al volver de Google, así que el puerto y el
    // "state" (y el nivel de permisos) se guardan también en la pestaña.
    const guardar = (k, v) => { try { sessionStorage.setItem(k, v); } catch (_) {} };
    const leer = (k) => { try { return sessionStorage.getItem(k); } catch (_) { return null; } };

    const port = params.get("port") || leer("nexo_port");
    const state = params.get("state") || leer("nexo_state");
    const loginHint = params.get("loginHint") || leer("nexo_login_hint") || "";
    if (port) guardar("nexo_port", port);
    if (state) guardar("nexo_state", state);
    if (loginHint) guardar("nexo_login_hint", loginHint);

    if (!port || !state) {
      button.disabled = true;
      status.textContent = "Abre esta página desde la app Nexo para poder acceder.";
      status.className = "status error";
    }

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Niveles de permiso, de más a menos. Si Google rechaza un ámbito (por
    // ejemplo porque todavía no está añadido en la pantalla de consentimiento
    // de OAuth), se reintenta con el siguiente nivel: el acceso con Google
    // nunca se queda bloqueado por un permiso opcional. La app avisa luego de
    // qué falta (calendario o tareas).
    const NIVELES = [
      [
        "https://www.googleapis.com/auth/calendar",
        "https://www.googleapis.com/auth/tasks",
      ],
      ["https://www.googleapis.com/auth/calendar"],
      [],
    ];
    let nivel = Number(leer("nexo_nivel") ?? 0);
    if (!Number.isInteger(nivel) || nivel < 0 || nivel >= NIVELES.length) {
      nivel = 0;
    }

    // Vuelve a la app con el error, para que no se quede esperando.
    function avisarApp(mensaje) {
      if (!port || !state) return;
      const target = new URL(`http://127.0.0.1:${port}/`);
      target.searchParams.set("state", state);
      target.searchParams.set("error", mensaje);
      window.location.replace(target.toString());
    }

    function limpiarGuardado() {
      ["nexo_port", "nexo_state", "nexo_login_hint", "nexo_nivel"].forEach((k) => {
        try { sessionStorage.removeItem(k); } catch (_) {}
      });
    }

    // Devuelve el token a la app de escritorio (servidor local en 127.0.0.1).
    async function entregar(result) {
      // Ojo: result.user.getIdToken() es un token de Firebase, no de Google.
      // Para signInWithCredential en la app de escritorio hace falta el
      // idToken de Google que devuelve el proveedor OAuth.
      const oauthCredential = GoogleAuthProvider.credentialFromResult(result);
      const idToken = oauthCredential?.idToken ?? "";
      const accessToken = oauthCredential?.accessToken ?? "";
      if (!idToken) {
        throw new Error("Google no devolvió un idToken válido.");
      }

      // La sesión del navegador ya no se necesita: la app de escritorio
      // canjea el token por su propia sesión de Firebase.
      try { await signOut(auth); } catch (_) {}

      status.textContent = "Acceso correcto. Volviendo a Nexo...";
      const target = new URL(`http://127.0.0.1:${port}/`);
      target.searchParams.set("state", state);
      target.searchParams.set("idToken", idToken);
      target.searchParams.set("accessToken", accessToken);
      limpiarGuardado();
      window.location.replace(target.toString());
    }

    async function manejarError(error) {
      const code = error?.code ?? "";
      const detalle = `${code} ${error?.message ?? ""}`.toLowerCase();
      let message = error?.message ?? "No se pudo completar el acceso.";
      if (code === "auth/popup-closed-by-user" || code === "auth/cancelled-popup-request") {
        message = "Se cerró la ventana de Google antes de terminar.";
      } else if (code === "auth/unauthorized-domain") {
        message = "Este dominio no está autorizado en Firebase Authentication.";
      } else if (code === "auth/operation-not-allowed") {
        message = "El acceso con Google no está habilitado en Firebase.";
      } else if (code === "auth/web-storage-unsupported") {
        message = "El navegador bloquea el almacenamiento que necesita Google.";
      }

      // Baja un nivel de permisos cuando Google rechaza alguno.
      if (detalle.includes("scope") && nivel < NIVELES.length - 1) {
        nivel++;
        guardar("nexo_nivel", String(nivel));
        status.className = "status";
        status.textContent =
          NIVELES[nivel].length === 0
            ? "Google no acepta todavía esos permisos; entrando solo con la cuenta..."
            : "Google no acepta todavía el permiso de tareas; entrando con el calendario...";
        await entrarConGoogle();
        return;
      }

      status.textContent = message;
      status.className = "status error";
      button.disabled = false;
      avisarApp(message);
    }

    async function entrarConGoogle() {
      button.disabled = true;
      status.className = "status";
      status.textContent = "Abriendo la cuenta de Google...";
      try {
        const provider = new GoogleAuthProvider();
        for (const scope of NIVELES[nivel]) provider.addScope(scope);
        // Si la app ya sabe qué cuenta usa, se preselecciona para no tener
        // que elegirla cada vez. Sin pista, se muestra el selector.
        provider.setCustomParameters(
          loginHint
            ? { login_hint: loginHint }
            : { prompt: "select_account" },
        );
        // Redirección en la misma pestaña: no depende de ventanas emergentes
        // ni de cookies de terceros, que los navegadores actuales bloquean.
        await signInWithRedirect(auth, provider);
      } catch (error) {
        await manejarError(error);
      }
    }

    button.addEventListener("click", async () => {
      nivel = 0;
      guardar("nexo_nivel", "0");
      await entrarConGoogle();
    });

    // Al volver de Google, la página se recarga y aquí llega el resultado.
    if (port && state) {
      status.textContent = "Comprobando el acceso con Google...";
      getRedirectResult(auth)
        .then(async (result) => {
          if (!result || !result.user) {
            status.textContent = "";
            return;
          }
          await entregar(result);
        })
        .catch(async (error) => {
          await manejarError(error);
        });
    }
  </script>
</body>
</html>
